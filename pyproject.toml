[project]
name = "one-object-loom"
version = "0.1.0"
description = "A single-branch auto-itterating text generator using phi3:mini and ollama"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ['ollama == 0.6.2']

[project.scripts]
one-object-loom = "one_object_loom:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
